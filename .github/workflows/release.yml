name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build Go tools
        run: |
          set -e
          cd for-quickshell/go
          export CGO_ENABLED=0
          ldflags="-s -w -buildid="
          for b in launch music cal cava-internal screenpicker audio network bluetooth; do
            go build -trimpath -mod=vendor -ldflags="$ldflags" -o "$GITHUB_WORKSPACE/dist/$b" "./cmd/$b"
          done
          cd wallpaper
          go build -trimpath -mod=vendor -ldflags="$ldflags" -o "$GITHUB_WORKSPACE/dist/wallpaper-picker" .
          cd ../coreaura
          go build -trimpath -mod=vendor -ldflags="$ldflags" -o "$GITHUB_WORKSPACE/dist/CoreAura" .

      - name: Assemble .deb
        run: |
          set -e
          V=${GITHUB_REF_NAME#v}
          ROOT="jes-shell_${V}-1_amd64"
          mkdir -p "$ROOT/DEBIAN" "$ROOT/usr/share/jes" "$ROOT/usr/bin"

          cp -r .local/JES/quickshell "$ROOT/usr/share/jes/quickshell"
          install -Dm755 dist/launch           "$ROOT/usr/share/jes/quickshell/launcher/launch"
          install -Dm755 dist/wallpaper-picker "$ROOT/usr/share/jes/quickshell/wallpaper/wallpaper-picker"
          install -Dm755 dist/music            "$ROOT/usr/share/jes/quickshell/scripts/music"
          install -Dm755 dist/cal              "$ROOT/usr/share/jes/quickshell/scripts/cal"
          install -Dm755 dist/cava-internal    "$ROOT/usr/share/jes/quickshell/scripts/Cava-internal"
          install -Dm755 dist/screenpicker     "$ROOT/usr/share/jes/quickshell/screenpicker/screenpicker"
          install -Dm755 dist/audio            "$ROOT/usr/share/jes/quickshell/scripts/audio"
          install -Dm755 dist/network          "$ROOT/usr/share/jes/quickshell/scripts/network"
          install -Dm755 dist/bluetooth        "$ROOT/usr/share/jes/quickshell/scripts/bluetooth"

          # CoreAura daemon
          install -Dm755 dist/CoreAura "$ROOT/usr/share/jes/quickshell/CoreAura/CoreAura"

          mkdir -p "$ROOT/etc/jes"
          cat > "$ROOT/etc/jes/coreaura.toml" <<EOF
          [CoreAura]
          enabled = true
          kernel_priority_max = 3
          services = []
          log_tail_lines = 300
          resource_poll_interval_sec = 5
          cpu_threshold_percent = 85
          gpu_threshold_percent = 85
          dedup_window_sec = 30
          EOF

          mkdir -p "$ROOT/usr/lib/systemd/system"
          cat > "$ROOT/usr/lib/systemd/system/coreaura.service" <<EOF
          [Unit]
          Description=CoreAura — JES monitoring daemon
          Wants=dbus.service
          After=dbus.service systemd-journald.service

          [Service]
          Type=simple
          ExecStart=/usr/share/jes/quickshell/CoreAura/CoreAura -config /etc/jes/coreaura.toml
          Restart=on-failure
          RestartSec=2

          User=root
          Group=root

          NoNewPrivileges=true
          ProtectSystem=full
          ProtectHome=false
          ProtectKernelTunables=true
          ProtectKernelModules=true
          ProtectControlGroups=true
          ProtectClock=true
          ProtectHostname=true
          PrivateTmp=true
          RestrictSUIDSGID=true

          [Install]
          WantedBy=multi-user.target
          EOF

          install -Dm644 /dev/stdin "$ROOT/usr/share/dbus-1/system.d/org.jes.CoreAura.conf" <<EOF
          <!DOCTYPE busconfig PUBLIC
            "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
            "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
          <busconfig>
            <policy user="root">
              <allow own="org.jes.CoreAura"/>
              <allow send_destination="org.jes.CoreAura"/>
              <allow receive_sender="org.jes.CoreAura"/>
            </policy>

            <policy context="default">
              <allow send_destination="org.jes.CoreAura"/>
              <allow receive_sender="org.jes.CoreAura"/>
            </policy>
          </busconfig>
          EOF

          mkdir -p "$ROOT/usr/share/jes/config" "$ROOT/usr/share/jes/matugen"
          cp -r .config/JES/* "$ROOT/usr/share/jes/config/"
          cp -r .local/JES/matugen/* "$ROOT/usr/share/jes/matugen/"

          install -Dm755 .local/bin/jes-cli "$ROOT/usr/bin/jes-cli"

          install -Dm644 completions/jes-cli.bash "$ROOT/usr/share/bash-completion/completions/jes-cli"
          install -Dm644 completions/_jes-cli     "$ROOT/usr/share/zsh/site-functions/_jes-cli"
          install -Dm644 completions/jes-cli.fish "$ROOT/usr/share/fish/vendor_completions.d/jes-cli.fish"

          install -Dm644 .local/share/fonts/ttf/FauxHanamin.ttf "$ROOT/usr/share/fonts/TTF/FauxHanamin.ttf"

          mkdir -p "$ROOT/usr/lib/systemd/user"
          cat > "$ROOT/usr/lib/systemd/user/jes.service" <<EOF
          [Unit]
          Description=Just Enough Shell
          PartOf=graphical-session.target
          After=graphical-session.target
          Requisite=graphical-session.target

          [Service]
          ExecStart=/usr/bin/qs -c /usr/share/jes/quickshell
          Restart=on-failure
          RestartSec=2

          [Install]
          WantedBy=graphical-session.target
          EOF

          install -Dm644 /dev/stdin "$ROOT/usr/lib/udev/rules.d/99-jes-i2c.rules" <<EOF
          SUBSYSTEM=="i2c", KERNEL=="i2c-[0-9]*", TAG+="uaccess"
          EOF

          install -Dm644 /dev/stdin "$ROOT/usr/lib/tmpfiles.d/jes.conf" <<EOF
          d %h/.cache/JES               0755 - - -
          d %h/.cache/JES/walls         0755 - - -
          d %h/.cache/JES/wall_prevs    0755 - - -
          d %h/.cache/JES/jes_music_art 0755 - - -
          d %h/.local/state             0755 - - -
          C %h/.config/JES              0755 - - - /usr/share/jes/config
          EOF

          cat > "$ROOT/DEBIAN/control" <<EOF
          Package: jes-shell
          Version: $V-1
          Architecture: amd64
          Maintainer: _ORFLEM_ <zenkinzahar@gmail.com>
          Depends: quickshell, pipewire, wireplumber, upower, kdeconnect, ddcutil, i2c-tools, brightnessctl, pamixer, wl-clipboard, cliphist, grim, cava, libnotify, dbus, pciutils, ffmpeg, python3, zip, unzip, matugen, taplo-cli, jq, inotify-tools, micro
          Recommends: qt6-multimedia, qt6-imageformats, qt6-svg
          Suggests: bluez
          Description: Fast & minimal desktop shell for Wayland WMs
           WM-agnostic Quickshell desktop shell with plugin system.
          EOF

          dpkg-deb --root-owner-group --build "$ROOT"

      - name: Build ALT RPM (Sisyphus container)
        run: |
          set -e
          V=${GITHUB_REF_NAME#v}
          mkdir -p rpmbuild-alt/{SOURCES,SPECS}
          cp packaging/alt/jes-shell.spec rpmbuild-alt/SPECS/
          sed -i "s/^Version:.*/Version: $V/" rpmbuild-alt/SPECS/jes-shell.spec
          tar czf "rpmbuild-alt/SOURCES/jes-shell-$V.tar" --exclude=.git --exclude=rpmbuild-alt .
          docker run --rm -v "$PWD:/src" -w /src alt:sisyphus bash -c '
            apt-get update &&
            apt-get install -y rpm-build golang &&
            useradd -m builder &&
            chown -R builder:builder /src &&
            su builder -c "
              rpmbuild --define \"_topdir /src/rpmbuild-alt\" -ba rpmbuild-alt/SPECS/jes-shell.spec &&
              cp rpmbuild-alt/RPMS/*/*.rpm /src/ &&
              cp rpmbuild-alt/SRPMS/*.rpm /src/
            "
          '

      - name: Build Fedora RPM
        run: |
          set -e
          V=${GITHUB_REF_NAME#v}
          mkdir -p rpmbuild-fc/{SOURCES,SPECS}
          cp packaging/fedora/jes.spec rpmbuild-fc/SPECS/
          sed -i "s/^Version:.*/Version: $V/" rpmbuild-fc/SPECS/jes.spec
          tar czf "rpmbuild-fc/SOURCES/jes-shell-$V.tar.gz" --exclude=.git --exclude=rpmbuild-alt --exclude=rpmbuild-fc .
          docker run --rm -v "$PWD:/src" -w /src fedora:latest bash -c '
            dnf install -y rpm-build golang systemd-rpm-macros &&
            rpmbuild --define "_topdir /src/rpmbuild-fc" -ba rpmbuild-fc/SPECS/jes.spec &&
            cp rpmbuild-fc/RPMS/*/*.rpm /src/ &&
            cp rpmbuild-fc/SRPMS/*.rpm /src/
          '

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.deb
            *.rpm
